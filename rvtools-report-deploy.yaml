apiVersion: v1
kind: Pod
metadata:
  name: rvtools-report
  labels:
    app: rvtools-report
spec:
  containers:
  - name: httpd
    image: busybox:1.36
    command: ["httpd", "-f", "-p", "8080", "-h", "/data"]
    ports:
    - containerPort: 8080
    volumeMounts:
    - name: html-files
      mountPath: /data
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  volumes:
  - name: html-files
    configMap:
      name: rvtools-report-cm
      defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: rvtools-report-svc
spec:
  selector:
    app: rvtools-report
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rvtools-report-route
spec:
  to:
    kind: Service
    name: rvtools-report-svc
  port:
    targetPort: 8080
  tls:
    termination: edge
---
apiVersion: v1
kind: Pod
metadata:
  name: cloudflared
  namespace: mfec-vm-tools
spec:
  containers:
    - name: cloudflared
      image: cloudflare/cloudflared:latest
      args:
        - tunnel
        - --no-autoupdate
        - --url
        - http://rvtools-report-svc:8080
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
